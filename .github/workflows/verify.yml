name: verify

# Re-derive every number reported in either paper directly from the shipped
# data.  This is the machine-readable form of the papers' central claim: that
# their reported values are reproducible from the released artifacts alone.

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Re-derive all reported numbers
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pandas scikit-learn matplotlib

      - name: Verify the controlled-analysis paper
        run: |
          python code/audit_claims.py | tee /tmp/audit_r1.log
          grep -q "FAIL: 0" /tmp/audit_r1.log || (echo "::error::R1 audit failed"; exit 1)

      - name: Verify the measurement paper
        run: |
          python code/audit_paper_measurement.py | tee /tmp/audit_measurement.log
          grep -q "FAIL: 0" /tmp/audit_measurement.log || (echo "::error::measurement audit failed"; exit 1)

      - name: Check the bibliography parses and every citation resolves
        run: python code/check_references_bib.py

      - name: Regenerate the analyses
        run: |
          python code/analyze_marker_stability_map.py --outdir /tmp/regen
          python code/analyze_degeneration.py --outdir /tmp/regen
          python code/make_figures.py --outdir /tmp/regen/figs
          python code/make_figures_measurement.py --outdir /tmp/regen/figs

      - name: Upload regenerated figures
        uses: actions/upload-artifact@v4
        with:
          name: figures-regenerated
          path: /tmp/regen/figs
          retention-days: 7
